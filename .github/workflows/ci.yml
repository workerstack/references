# Hand-written until this repo runs on a @workerstack/repo release whose release pack fits a package with no code.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun repo ci
      - name: The tarball holds the index
        run: bun pm pack --dry-run --ignore-scripts | grep -q 'references/INDEX.md'
      - name: Installing the package runs no script
        run: '! grep -qE ''"(preinstall|install|postinstall)"'' package.json'
